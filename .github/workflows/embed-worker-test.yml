name: Embed Worker Latency Test

# One-shot verification harness for the "GitHub Actions as a free embedding
# worker" option: proves the real fastembed + bge-small-en-v1.5 pipeline runs
# correctly on a GitHub-hosted runner and reports real internal timings
# (dependency install, model load, embedding compute) so those numbers can be
# compared against the in-process (Render) option instead of estimated.
on:
  workflow_dispatch:

jobs:
  embed-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip and fastembed model weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/fastembed
            ~/.cache/huggingface
          key: embed-worker-fastembed-bge-small-v1

      - name: Install fastembed
        run: |
          echo "INSTALL_START=$(date +%s.%N)" >> "$GITHUB_ENV"
          pip install --quiet fastembed
          echo "INSTALL_END=$(date +%s.%N)" >> "$GITHUB_ENV"

      - name: Embed sample chunks and verify correctness
        run: |
          python - <<'PY'
          import time
          import numpy as np

          t_load_start = time.monotonic()
          from fastembed import TextEmbedding
          model = TextEmbedding(model_name="BAAI/bge-small-en-v1.5")
          t_load_end = time.monotonic()

          documents = [
              "def authenticate_user(username, password):\n    return check_credentials(username, password)",
              "class UserAuthMiddleware:\n    def __call__(self, request):\n        return self.verify_token(request.headers)",
              "def calculate_shipping_cost(weight, distance):\n    return weight * distance * RATE",
          ] * 25  # 75 short chunks, roughly comparable to one real file's worth of chunks

          t_embed_start = time.monotonic()
          doc_vectors = [v.tolist() for v in model.embed(documents, batch_size=96)]
          t_embed_end = time.monotonic()

          query = "Represent this sentence for searching relevant passages: user login and authentication logic"
          query_vec = np.array(list(model.embed([query]))[0])

          def cos(a, b):
              a, b = np.array(a), np.array(b)
              return float(np.dot(a, b) / (np.linalg.norm(a) * np.linalg.norm(b)))

          sim_relevant = cos(query_vec, doc_vectors[0])
          sim_irrelevant = cos(query_vec, doc_vectors[2])

          print(f"MODEL_LOAD_SECONDS={t_load_end - t_load_start:.3f}")
          print(f"EMBED_SECONDS_FOR_{len(documents)}_CHUNKS={t_embed_end - t_embed_start:.3f}")
          print(f"VECTOR_DIM={len(doc_vectors[0])}")
          print(f"SIM_AUTH_QUERY_VS_AUTH_CODE={sim_relevant:.4f}")
          print(f"SIM_AUTH_QUERY_VS_SHIPPING_CODE={sim_irrelevant:.4f}")
          assert len(doc_vectors[0]) == 384, "dimension mismatch — would break PGVECTOR_DIMENSION=384"
          assert sim_relevant > sim_irrelevant, "retrieval asymmetry broken — query not closer to relevant doc"
          print("CORRECTNESS_CHECK=PASS")
          PY
          echo "INSTALL_SECONDS=$(echo "$INSTALL_END - $INSTALL_START" | bc)"
