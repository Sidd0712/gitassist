name: Embed Worker

# Production embedding worker for EMBEDDING_PROVIDER=github_actions
# (see backend/services/rag/embedding_service.py). Dispatched once per
# embed_documents/embed_query/embed_queries_batch call with a job_id; reads
# the pending row from Postgres, embeds with fastembed, writes the result
# back. Requires the DATABASE_URL repository secret.
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "embedding_jobs.job_id to process"
        required: true
        type: string

jobs:
  embed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            backend/scripts/gh_embed_worker.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip and fastembed model weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/fastembed
            ~/.cache/huggingface
          key: embed-worker-fastembed-bge-small-v1

      - name: Install dependencies
        run: pip install --quiet fastembed "psycopg[binary]"

      - name: Run embedding job
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python backend/scripts/gh_embed_worker.py "${{ inputs.job_id }}"
